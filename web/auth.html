<main id="authPanel" class="welcome">
  <div class="brand-mark">N</div><span class="eyebrow">NEXO · Finanzas en pareja</span>
  <h1 id="authTitle">Bienvenido a NEXO</h1>
  <p>Organiza tus cuentas, presupuestos y metas. Tus datos se guardan en tu espacio privado.</p>
  <form id="authForm" style="width:100%;max-width:420px;display:grid;gap:16px">
    <div id="emailField" class="field"><label for="authEmail">Correo electrónico</label><input id="authEmail" class="input" type="email" autocomplete="email" required></div>
    <div id="passwordField" class="field"><label for="authPassword">Contraseña</label><input id="authPassword" class="input" type="password" autocomplete="current-password" required></div>
    <button id="authSubmit" class="btn primary" type="submit">Entrar</button>
  </form>
  <p id="authMessage" class="welcome-detail" role="status" aria-live="polite"></p>
  <div class="sync-actions"><button class="btn secondary" id="authSwitch" type="button">Crear una cuenta</button><button class="btn ghost" id="forgotPassword" type="button">Olvidé mi contraseña</button></div>
  <p class="welcome-detail">No necesitas ChatGPT. Regístrate con tu correo y contraseña para continuar desde cualquier dispositivo.</p>
</main>
